name: gg_project_root
description: Returns the dart project root for a given folder by looking for pubspec_yaml.dart
version: 2.1.1
repository: https://github.com/inlavigo/gg_project_root.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  colorize: ^3.0.0
  gg_args: ^3.1.1
  gg_log: ^1.2.0
  gg_process: ^1.2.0
  path: ^1.9.1

dev_dependencies:
  dna_ggsuite: ^0.2.0
  gg_capture_print: ^1.1.0
  helix: ^1.3.0
  lints: ^6.1.0
  test: ^1.31.2