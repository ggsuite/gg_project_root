name: gg_project_root
description: Returns the dart project root for a given folder by looking for pubspec_yaml.dart
version: 2.0.1
repository: https://github.com/inlavigo/gg_project_root.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  colorize: ^3.0.0
  gg_args: ^3.0.1
  gg_log: ^1.0.7
  gg_process: ^1.1.7
  path: ^1.9.1

dev_dependencies:
  gg_capture_print: ^1.0.10
  lints: ^6.1.0
  test: ^1.31.2